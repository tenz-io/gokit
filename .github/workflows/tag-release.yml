name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., v3.0.1). Required.'
        required: true
        type: string
      update_go_mod:
        description: 'Also update go.mod version references in consumer modules'
        required: false
        type: boolean
        default: false
      modules:
        description: 'Submodules to tag (comma-separated, blank = all non-example modules)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (print tags without creating them)'
        required: false
        type: boolean
        default: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Parse submodules
        id: submodules
        run: |
          VERSION="${{ inputs.version }}"

          if [ -n "${{ inputs.modules }}" ]; then
            # User-specified modules
            IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
            for m in "${MODS[@]}"; do
              echo "$m"
            done > /tmp/modules.txt
          else
            # Extract all non-example modules from go.work
            grep '\./' go.work | grep -v 'use (' | grep -v '^)' \
              | tr -d $' \t\r' | grep -v '/example' \
              | sed 's|^\./||' > /tmp/modules.txt
          fi

          echo "Modules to tag ($(wc -l < /tmp/modules.txt | tr -d ' ')):"
          cat /tmp/modules.txt

      - name: Tag submodules
        run: |
          VERSION="${{ inputs.version }}"
          DRY_RUN="${{ inputs.dry_run }}"

          # Tag prefix = module path minus trailing /vN (Go's rule:
          # github.com/tenz-io/gokit/annotation/v3 -> tag annotation/v3.0.1).
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            [ -z "$VERSION" ] && { echo "Skip $mod (no version)"; continue; }

            prefix=$(echo "$mod" | sed -E 's|/v[0-9]+$||')
            TAG="${prefix}/${VERSION}"

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] git tag -a $TAG -m 'Release $mod $VERSION'"
            else
              git tag -d "$TAG" 2>/dev/null || true
              git tag -a "$TAG" -m "Release $mod $VERSION" -f
              echo "Created tag: $TAG"
            fi
          done < /tmp/modules.txt

      - name: Push tags
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin --tags --force

      - name: Update go.mod versions
        if: ${{ inputs.update_go_mod == true && inputs.dry_run == false }}
        run: |
          VERSION="${{ inputs.version }}"

          echo "Updating go.mod version references to ${VERSION}"

          while IFS= read -r mod; do
            [ -z "$mod" ] && continue

            # Determine the module path
            MOD_PATH="$mod"
            if [ -f "${mod}/go.mod" ]; then
              MOD_PATH=$(head -1 "${mod}/go.mod" | awk '{print $2}')
            fi

            echo "  Module: $MOD_PATH -> ${VERSION}"
          done < /tmp/modules.txt

          echo "go.mod updates not yet automated — run scripts/update-versions.sh locally"
          echo "or use sed to batch-replace version strings across go.mod files."
