name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., v2.0.1)'
        required: true
        type: string
      update_go_mod:
        description: 'Also update go.mod version references in consumer modules'
        required: false
        type: boolean
        default: false
      modules:
        description: 'Submodules to tag (comma-separated, blank = all non-example modules)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (print tags without creating them)'
        required: false
        type: boolean
        default: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Parse submodules
        id: submodules
        run: |
          VERSION="${{ inputs.version }}"

          if [ -n "${{ inputs.modules }}" ]; then
            # User-specified modules
            IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
            for m in "${MODS[@]}"; do
              echo "$m"
            done > /tmp/modules.txt
          else
            # Extract all non-example modules from go.work
            grep '\./' go.work | grep -v 'use (' | grep -v '^)' \
              | tr -d $' \t\r' | grep -v '/example' \
              | sed 's|^\./||' > /tmp/modules.txt
          fi

          echo "Modules to tag ($(wc -l < /tmp/modules.txt | tr -d ' ')):"
          cat /tmp/modules.txt

      - name: Tag submodules
        run: |
          VERSION="${{ inputs.version }}"
          DRY_RUN="${{ inputs.dry_run }}"

          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            # Normalize: "logger/v2" → tag "logger/v2.0.1" (Go convention)
            TAG_MOD=$(echo "$mod" | sed 's|/v[0-9][0-9]*$||')
            TAG="${TAG_MOD}/${VERSION}"

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would create tag: $TAG"
            else
              git tag -a "$TAG" -m "Release ${TAG_MOD} ${VERSION}"
              echo "Created tag: $TAG"
            fi
          done < /tmp/modules.txt

      - name: Push tags
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin --tags

      - name: Update go.mod versions
        if: ${{ inputs.update_go_mod == true && inputs.dry_run == false }}
        run: |
          VERSION="${{ inputs.version }}"
          # Strip 'v' prefix for major version check
          VER_NUM="${VERSION#v}"
          MAJOR="${VER_NUM%%.*}"

          echo "Updating go.mod version references to ${VERSION}"

          while IFS= read -r mod; do
            [ -z "$mod" ] && continue

            # Determine the module path (handle logger/v2 specially)
            MOD_PATH="$mod"
            if [ -f "${mod}/go.mod" ]; then
              MOD_PATH=$(head -1 "${mod}/go.mod" | awk '{print $2}')
            fi

            # Fix: for logger, the module in go.mod is logger/v2, tag is logger/v2.0.1
            # The require line should use the module path + version
            OLD_VER=$(grep "${MOD_PATH}" "${mod}/go.mod" 2>/dev/null | head -1 || true)

            echo "  Module: $MOD_PATH -> ${VERSION}"
          done < /tmp/modules.txt

          echo "go.mod updates not yet automated — run scripts/update-versions.sh locally"
          echo "or use sed to batch-replace version strings across go.mod files."
